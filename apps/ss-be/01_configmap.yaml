apiVersion: v1
kind: ConfigMap
metadata:
  name: ss-be-config
  labels:
    app: ss-be
# ss-be application.yml의 환경변수와 이름을 맞춘다. 민감 값(INFERENCE_API_KEY)은 02_secret.yaml에 둔다.
data:
  # apps/ss-vllm의 vllm 네임스페이스 Service. OpenAI 호환 /v1 앞까지 입력한다.
  INFERENCE_BASE_URL: "http://vllm-qwen.vllm.svc.cluster.local:8000"
  # apps/ss-vllm의 --served-model-name과 맞춘다.
  INFERENCE_MODEL: "qwen3-4b-fp8"
  INFERENCE_MODE: "live"
  INFERENCE_TIMEOUT_SECONDS: "45"
  # apps/ss-triton(이름만 Triton, 내용은 CPU Whisper STT) Service.
  STT_BASE_URL: "http://ss-triton:8001"
  STT_TIMEOUT_SECONDS: "120"
  # 같은 네임스페이스의 Redis Service로 연결한다.
  REDIS_HOST: "ss-redis"
  REDIS_PORT: "6379"
  # Redis 연결이 끊기면 BE를 트래픽 대상에서 제외하고, 복구되면 다시 포함한다.
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: "readinessState,redis"
  CONVERSATION_TTL_SECONDS: "86400"
  SESSION_COOKIE_SECURE: "true"
