apiVersion: v1
kind: ConfigMap
metadata:
  name: ss-be-config
  labels:
    app: ss-be
# ss-be application.yml의 환경변수와 이름을 맞춘다. 민감 값(INFERENCE_API_KEY)은 02_secret.yaml에 둔다.
data:
  # TODO: Triton 서빙 주소가 정해지면 바꾼다. OpenAI 호환 /v1 앞까지 입력한다.
  INFERENCE_BASE_URL: "http://ss-triton:8000"
  # TODO: Triton에 올린 모델 이름으로 바꾼다.
  INFERENCE_MODEL: ""
  INFERENCE_MODE: "live"
  INFERENCE_TIMEOUT_SECONDS: "45"
  # TODO: STT 서빙 주소가 정해지면 바꾼다.
  STT_BASE_URL: "http://ss-stt:8001"
  STT_TIMEOUT_SECONDS: "120"
  # 같은 네임스페이스의 Redis Service로 연결한다.
  REDIS_HOST: "ss-redis"
  REDIS_PORT: "6379"
  CONVERSATION_TTL_SECONDS: "86400"
  SESSION_COOKIE_SECURE: "true"
