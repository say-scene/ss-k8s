# 진행 중 대화의 임시 이력 저장소. 이력 소실 시 검증된 로컬 스냅샷으로 복원한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ss-redis
  labels:
    app: ss-redis
spec:
  replicas: 1
  # 두 Redis 인스턴스가 서로 다른 이력을 서비스하지 않도록 교체 시 중첩을 피한다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ss-redis
  template:
    metadata:
      labels:
        app: ss-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          # 실측 전 개발 기본값. 메모리 사용량을 보고 조정한다.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ss-redis
  labels:
    app: ss-redis
spec:
  type: ClusterIP
  selector:
    app: ss-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
