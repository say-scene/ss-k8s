apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# resources에 적은 순서대로 출력한다. kind 기준 정렬로 바꾸려면 order를 legacy로 둔다.
sortOptions:
  order: fifo

# 02_secret.yaml은 커밋하지 않는다. 02_secret.example.yaml을 복사해서 값을 채운다.
resources:
  - 01_configmap.yaml
  - 02_secret.example.yaml
  - 03_deployment.yaml
  - 04_service.yaml

# newTag는 ss-be의 ecr-push workflow가 main push마다 짧은 SHA로 갱신한다.
images:
  - name: ss-be
    newName: 944296702922.dkr.ecr.ap-northeast-2.amazonaws.com/ss-be
    newTag: 685fa4c
