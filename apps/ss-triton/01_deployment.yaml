apiVersion: apps/v1
kind: Deployment
metadata:
  name: ss-triton
  labels:
    app: ss-triton
spec:
  # 이름은 ss-triton이지만 CPU Whisper STT다(ss-triton README). 첫 STT 이미지 태그 갱신 후 1로 바꾼다.
  replicas: 0
  selector:
    matchLabels:
      app: ss-triton
  template:
    metadata:
      labels:
        app: ss-triton
    spec:
      # 별도 노드 없이 control plane(t3.xlarge)에 둔다. CPU limit으로 etcd·apiserver 몫을 지킨다.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: whisper
          # kustomization.yaml의 images가 ECR 주소와 태그로 바꾼다. 이름을 바꾸면 CI 태그 갱신이 끊긴다.
          image: ss-triton
          ports:
            - name: http
              containerPort: 8001
          env:
            # 모델 비교 시 이 값만 바꾼다(예: large-v3-turbo). 스레드 수는 CPU limit과 맞춘다.
            - name: WHISPER_MODEL
              value: small.en
            - name: WHISPER_CPU_THREADS
              value: "2"
            # 동시 계산 수. CPU limit 2에서는 1이 처리량이 같고 지연이 짧다. 노드를 키우면 올린다.
            - name: STT_CONCURRENCY
              value: "1"
            # 슬롯을 기다리는 최대 시간. 넘으면 503 STT_BUSY. BE timeout(120초)보다 짧게 둔다.
            - name: STT_QUEUE_TIMEOUT
              value: "10"
          volumeMounts:
            - name: model-cache
              mountPath: /cache
          # 서버는 모델 로드가 끝난 뒤 포트를 연다. 모델 다운로드 시간을 기다린다.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # ponytail: 실측 전 추정값. memory limit은 large-v3-turbo 비교까지 고려한다.
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        # Pod 재시작 시 모델을 다시 받는다. small.en은 수백 MB라 감수한다.
        - name: model-cache
          emptyDir:
            sizeLimit: 4Gi
