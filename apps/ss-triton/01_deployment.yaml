apiVersion: apps/v1
kind: Deployment
metadata:
  name: ss-triton
  labels:
    app: ss-triton
spec:
  # 이름은 ss-triton이지만 CPU Whisper STT다(ss-triton README).
  replicas: 1
  # stt-bench NodePool은 노드 최대 1대라 RollingUpdate의 새 파드가 올라갈 자리가 없다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ss-triton
  template:
    metadata:
      labels:
        app: ss-triton
    spec:
      # 임시: A/B 측정 동안 platform/karpenter/nodepool-stt-bench.yaml의 전용 노드에 둔다.
      nodeSelector:
        sayscene.io/workload: stt
      tolerations:
        - key: sayscene.io/workload
          operator: Equal
          value: stt
          effect: NoSchedule
      containers:
        - name: whisper
          # kustomization.yaml의 images가 ECR 주소와 태그로 바꾼다. 이름을 바꾸면 CI 태그 갱신이 끊긴다.
          image: ss-triton
          ports:
            - name: http
              containerPort: 8001
          env:
            # 모델 비교 시 이 값만 바꾼다(예: large-v3-turbo). 스레드 수는 CPU limit과 맞춘다.
            - name: WHISPER_MODEL
              value: small.en
            - name: WHISPER_CPU_THREADS
              value: "2"
            # 동시 계산 수. CPU limit 2에서는 1이 처리량이 같고 지연이 짧다. 노드를 키우면 올린다.
            - name: STT_CONCURRENCY
              value: "1"
            # 슬롯을 기다리는 최대 시간. 넘으면 503 STT_BUSY. BE timeout(120초)보다 짧게 둔다.
            - name: STT_QUEUE_TIMEOUT
              value: "10"
          volumeMounts:
            - name: model-cache
              mountPath: /cache
          # 서버는 모델 로드가 끝난 뒤 포트를 연다. 모델 다운로드 시간을 기다린다.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # request = limit(Guaranteed)로 측정 중 CPU 몫을 고정한다.
          # CPU는 2 vCPU 노드 allocatable 1700m에서 DaemonSet 몫을 뺀 값이다. Pending이면 낮춘다.
          # 메모리는 t3.large 측정 피크 1.19GiB(small.en, 동시 4건) 기준. c7i.large(4GiB)에 들어가게 2Gi로 둔다.
          resources:
            requests:
              cpu: 1500m
              memory: 2Gi
            limits:
              cpu: 1500m
              memory: 2Gi
      volumes:
        # Pod 재시작 시 모델을 다시 받는다. small.en은 수백 MB라 감수한다.
        - name: model-cache
          emptyDir:
            sizeLimit: 4Gi
