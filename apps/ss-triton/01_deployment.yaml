apiVersion: apps/v1
kind: Deployment
metadata:
  name: ss-triton
  labels:
    app: ss-triton
spec:
  # 이름은 ss-triton이지만 CPU Whisper STT다(ss-triton README). 노드 1대에 1개씩 뜬다.
  # replicas는 03_scaledobject.yaml(KEDA)이 정한다. 여기에 적으면 sync마다 KEDA 값을 덮어쓴다.
  # 이미지·env 변경 배포 방식(KEDA 증감과는 무관). stt NodePool은 최대 2대다.
  # Pod 1개: 50% 내림 = 0이라 새 Pod를 2번째 노드에 먼저 띄운 뒤 기존 Pod를 내린다(끊김 없음).
  # Pod 2개: 3번째 노드가 없으니 1개를 먼저 내리고 그 노드에 새 Pod를 띄운다(잠시 1개로 서비스).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 50%
  selector:
    matchLabels:
      app: ss-triton
  template:
    metadata:
      labels:
        app: ss-triton
    spec:
      # platform/karpenter/nodepool-stt.yaml의 전용 노드(t3.large)에 둔다. 라벨·taint를 맞춘다.
      nodeSelector:
        sayscene.io/workload: stt
      tolerations:
        - key: sayscene.io/workload
          operator: Equal
          value: stt
          effect: NoSchedule
      containers:
        - name: whisper
          # kustomization.yaml의 images가 ECR 주소와 태그로 바꾼다. 이름을 바꾸면 CI 태그 갱신이 끊긴다.
          image: ss-triton
          ports:
            - name: http
              containerPort: 8001
          env:
            # 이미지에 넣은 small.en 경로(ss-triton Dockerfile). 기동 시 다운로드하지 않는다.
            # 모델 비교 시 이름(예: large-v3-turbo)으로 바꾸면 기존처럼 HF에서 받는다.
            - name: WHISPER_MODEL
              value: /models/small.en
            # t3.large(물리 1코어) 실측: threads·concurrency를 (2,1)·(1,1)·(1,2)로 바꿔도
            # 처리량은 약 0.16 rps로 같고 (1,2)는 p90만 나빠졌다. 가장 단순한 (1,1)로 둔다.
            - name: WHISPER_CPU_THREADS
              value: "1"
            # 동시 계산 수. 물리 코어 수보다 올려도 처리량이 늘지 않는다.
            - name: STT_CONCURRENCY
              value: "1"
            # 슬롯을 기다리는 최대 시간. 넘으면 503 STT_BUSY. BE timeout(120초)보다 짧게 둔다.
            - name: STT_QUEUE_TIMEOUT
              value: "10"
          volumeMounts:
            - name: model-cache
              mountPath: /cache
          # 서버는 모델 로드가 끝난 뒤 포트를 연다. 모델 다운로드 시간을 기다린다.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # request = limit(Guaranteed)로 측정 중 CPU 몫을 고정한다.
          # CPU는 t3.large allocatable 1700m에서 DaemonSet 몫을 뺀 값이다. 노드당 STT 1개라 더 낮출 이유가 없다.
          # 메모리는 t3.large 측정 피크 1.19GiB(small.en, 동시 4건) 기준.
          resources:
            requests:
              cpu: 1500m
              memory: 2Gi
            limits:
              cpu: 1500m
              memory: 2Gi
      volumes:
        # Pod 재시작 시 모델을 다시 받는다. small.en은 수백 MB라 감수한다.
        - name: model-cache
          emptyDir:
            sizeLimit: 4Gi
