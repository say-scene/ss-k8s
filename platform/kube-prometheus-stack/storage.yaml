# Prometheus 저장소. 기본 노드의 /var/lib/prometheus 를 local PV 로 노출한다.
# Operator 는 spec.volumes 로 저장소를 바꾸지 못하고 storageSpec 만 받는다.
# 그래서 hostPath 를 쓰려면 PV 를 거쳐야 한다.
#
# values 파일은 하위 폴더에 있어 매니페스트로 읽히지 않는다. 이 파일만 적용된다.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-prometheus
provisioner: kubernetes.io/no-provisioner
# 파드가 스케줄된 뒤에 바인딩한다. 노드가 정해져야 local 볼륨을 고를 수 있다.
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-local
spec:
  capacity:
    # retentionSize 2GiB 에 WAL 여유를 더한 값. 루트 디스크 여유 7.3G 안에서 잡는다.
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  # 지워도 디렉터리를 남긴다. 재설치 때 지표가 이어진다.
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-prometheus
  local:
    # 이 디렉터리는 미리 있어야 한다. local PV 는 hostPath 와 달리 만들어주지 않는다.
    #   sudo mkdir -p /var/lib/prometheus
    path: /var/lib/prometheus
  # 이 경로는 기본 노드에만 있다. 다른 노드에 스케줄되면 안 된다.
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ip-10-0-4-232.ap-northeast-2.compute.internal
---
# Grafana 저장소. 대시보드·태그·사용자 설정이 들어가는 grafana.db 를 담는다.
# persistence 를 켜지 않으면 emptyDir 라 파드가 다시 만들어질 때 전부 사라진다.
# 10-29 에 UI 로 만든 대시보드를 롤아웃 한 번에 잃고 이 PV 를 추가했다.
#
# StorageClass 는 prometheus 것을 재사용한다. no-provisioner 라 이름표 역할만 하고
# 따로 만들면 같은 내용이 하나 더 생긴다.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-local
spec:
  capacity:
    # 대시보드는 하나에 수십 KB 다. 수백 개여도 2Gi 를 넘지 않는다.
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-prometheus
  local:
    # 이 디렉터리는 미리 있어야 한다. local PV 는 만들어주지 않는다.
    #   sudo mkdir -p /var/lib/grafana
    path: /var/lib/grafana
  # Grafana 는 values.yaml 의 nodeSelector 로 이미 기본 노드에 고정돼 있다.
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ip-10-0-4-232.ap-northeast-2.compute.internal
