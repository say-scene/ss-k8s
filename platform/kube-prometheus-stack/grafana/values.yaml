grafana:
  # ALB가 /grafana 접두사를 유지하므로 Grafana가 subpath를 직접 처리한다.
  grafana.ini:
    server:
      root_url: /grafana/
      serve_from_sub_path: true

  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

  # 켜두어야 ③ 담당이 Loki·Tempo 데이터소스를 자기 폴더의 ConfigMap 으로 붙일 수 있다.
  # 꺼져 있으면 ③ 이 이 파일을 고쳐야 해서 담당 경계가 겹친다.
  sidecar:
    datasources:
      enabled: true
      label: grafana_datasource
    dashboards:
      enabled: true
      label: grafana_dashboard

  # 비밀번호는 공개 레포에 두지 않는다. Secret 이름만 적는다.
  # userKey · passwordKey 는 차트 기본값(admin-user · admin-password)을 그대로 쓴다.
  # Secret 은 ArgoCD 가 추적하지 않는다. 클러스터를 다시 만들면 Sync 전에 아래를 먼저 실행한다.
  # read -rs 라서 화면·히스토리에 남지 않고, 표준입력이라 ps 에도 안 보인다.
  #   read -rsp '비밀번호: ' PW && echo && kubectl apply -f - <<EOF
  #   apiVersion: v1
  #   kind: Secret
  #   metadata:
  #     name: grafana-admin
  #     namespace: monitoring
  #   type: Opaque
  #   stringData:
  #     admin-user: admin
  #     admin-password: "$PW"
  #   EOF
  #   unset PW
  admin:
    existingSecret: grafana-admin
