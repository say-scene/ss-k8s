grafana:
  # ALB가 /grafana 접두사를 유지하므로 Grafana가 subpath를 직접 처리한다.
  grafana.ini:
    server:
      root_url: /grafana/
      serve_from_sub_path: true

  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

  # 켜두어야 ③ 담당이 Loki·Tempo 데이터소스를 자기 폴더의 ConfigMap 으로 붙일 수 있다.
  # 꺼져 있으면 ③ 이 이 파일을 고쳐야 해서 담당 경계가 겹친다.
  sidecar:
    datasources:
      enabled: true
      label: grafana_datasource
    dashboards:
      enabled: true
      label: grafana_dashboard
