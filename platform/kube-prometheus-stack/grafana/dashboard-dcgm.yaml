apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-dcgm
  namespace: monitoring
  labels:
    # 이 라벨 하나로 끝난다. grafana/values.yaml 의 sidecar.dashboards 가 주워간다.
    # 따옴표가 필요하다. 없으면 YAML 이 숫자로 읽어 거부당한다.
    grafana_dashboard: "1"
# 출처: grafana.com 대시보드 12239 (NVIDIA DCGM Exporter Dashboard) latest revision.
# 원본에서 세 가지를 고쳤다.
#   __inputs · __requires 제거  — 프로비저닝에는 고를 사람이 없다
#   ${DS_PROMETHEUS} -> Prometheus (10 곳) — 실제 데이터소스 이름
#   tags 추가 — 원본은 비어 있다
# UI 에서 고칠 수 없다. 프로비저닝된 대시보드는 읽기 전용이다. 이 파일을 고친다.
