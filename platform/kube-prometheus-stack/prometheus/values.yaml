# 저장소는 기본 노드 루트 디스크를 쓴다. 10-28 에 16G -> 60G 로 확장했다.
# 여유 용량은 `df -h /` 로 확인한다. 공개 저장소라 값을 적지 않는다.
# retention 과 retentionSize 를 함께 걸고, 디스크 알림으로 포화를 막는다.
# 전환 기준은 ss-docs 가 아니라 test/kube-prometheus-stack-설치.md §5-0 참고.
prometheus:
  prometheusSpec:
    retention: 7d
    # TSDB 블록 기준이라 정확한 상한이 아니다. WAL 이 일시적으로 더 쓴다.
    # 설치 후 루트 디스크 여유가 4.6G 로 줄어 2GiB -> 1GiB 로 낮췄다.
    # 85% 디스크 알림이 상시 발화하지 않도록 하는 값이다.
    # 전용 볼륨으로 옮기면 7d 를 채울 만큼 올린다.
    retentionSize: 1GiB

    # false 로 두어야 ③ 담당이 만든 ServiceMonitor 도 수집된다.
    # true(기본값)면 이 차트의 release 라벨이 붙은 것만 본다.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false

    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      # cpu limits 는 걸지 않는다. 상한은 쓰로틀링을 일으켜 쿼리를 느리게 만든다.
      limits:
        memory: 3Gi

    # 저장소는 storageSpec 으로만 바꿀 수 있다.
    # spec.volumes 로 같은 이름을 선언하면 덮어쓰기가 아니라 중복이 되어 거부된다.
    #   spec.template.spec.volumes[8].name: Duplicate value
    # 다른 이름으로 volumeMounts 를 더해도 mountPath 중복으로 거부된다.
    #   containers[0].volumeMounts[3].mountPath: "/prometheus": must be unique
    # hostPath 를 쓰려면 local PersistentVolume 을 거쳐야 한다 (storage.yaml).
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-prometheus
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

  # ss-be 는 여기에 두지 않는다. apps/ss-be/07_servicemonitor.yaml 이 소유한다.
  # 앱의 포트 이름·경로가 바뀔 때 앱 폴더 안에서 끝나야 하므로 수집 측에 두지 않는다.
  # 위의 serviceMonitorSelectorNilUsesHelmValues: false 가 그쪽을 수집해 준다.
  additionalServiceMonitors:
    # 이름은 ss-triton 이지만 CPU Whisper STT 다. /metrics 가 API 와 같은 포트에 있다.
    - name: ss-triton
      namespaceSelector:
        matchNames:
          - sayscene
      selector:
        matchLabels:
          app: ss-triton
      endpoints:
        - port: http
          path: /metrics

# 루트 디스크를 쓰므로 포화를 먼저 알린다.
# 이 규칙이 디스크가 차서 노드 전체가 위험해지는 시나리오를 막는다.
additionalPrometheusRulesMap:
  node-disk:
    groups:
      - name: node-disk
        rules:
          - alert: NodeDiskFillingUp
            expr: >-
              100 - (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
              / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} * 100) > 85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "노드 루트 디스크 85% 초과"
              description: "{{ $labels.instance }} 의 루트 디스크가 85% 를 넘었다. 기본 노드면 Prometheus 보존을 줄이거나 전용 볼륨으로 옮긴다."

  # vLLM 큐가 쌓이면 첫 토큰까지의 시간이 늘어난다. 평상시 60ms, 부하 시 20초.
  # 응답시간이 아니라 TTFT 를 본다. 대화를 통째로 요약하는 ss-be 의
  # /api/v1/report 는 설계상 20초가 걸려 응답시간에 섞인다.
  #
  # 발동: 5분 평균 TTFT 가 1.2초를 2분 연속 넘으면 firing.
  # 알림: firing -> Alertmanager -> Discord. 부하 시작 후 약 4분 30초 뒤 도착한다.
  #       (5분 창 2분 + for 2분 + group_wait 30초)
  #       시험 한 번에 2통(발화·해소). 지속되어도 4시간 전에는 재전송하지 않는다.
  #
  # 메시지의 슬롯 분모는 최근 1시간 관측 최대값이다. --max-num-seqs 설정값이 아니다.
  vllm-latency:
    groups:
      - name: vllm-latency
        rules:
          - alert: VllmQueueLatency
            expr: >-
              rate(vllm:time_to_first_token_seconds_sum[5m])
              / rate(vllm:time_to_first_token_seconds_count[5m]) > 1.2
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "vLLM 첫 토큰 지연 증가"
              description: |-
                첫 토큰 {{ $value | humanizeDuration }} (5분 평균 · 평상시 60ms)
                동시처리슬롯: {{ with query "max(vllm:num_requests_running)" }}{{ . | first | value | printf "%.0f" }}{{ end }}/{{ with query "max(max_over_time(vllm:num_requests_running[1h]))" }}{{ . | first | value | printf "%.0f" }}{{ end }} · 슬롯대기: {{ with query "max(vllm:num_requests_waiting)" }}{{ . | first | value | printf "%.0f" }}{{ end }}건
                GPU {{ with query "DCGM_FI_DEV_GPU_UTIL" }}{{ . | first | label "hostname" }}{{ end }} : 생성 {{ with query "sum(rate(vllm:generation_tokens_total[5m]))" }}{{ . | first | value | printf "%.0f" }}{{ end }} tok/s · 입력 {{ with query "sum(rate(vllm:prompt_tokens_total[5m]))" }}{{ . | first | value | printf "%.0f" }}{{ end }} tok/s
                KV 캐시 {{ with query "max(vllm:kv_cache_usage_perc)" }}{{ . | first | value | humanizePercentage }}{{ end }} · 선점 {{ with query "sum(increase(vllm:num_preemptions_total[5m]))" }}{{ . | first | value | printf "%.0f" }}{{ end }}회 (KV 부족으로 요청을 되돌린 횟수)
                대기 0 이면 vLLM 밖의 원인
