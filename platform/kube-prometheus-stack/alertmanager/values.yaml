# 수신처는 Discord 로 연결한다. 라우팅 규칙만 깃에 두고 webhook URL 은 Secret 에서 읽는다.
# ss-k8s 는 공개 저장소라 URL 을 커밋할 수 없다. URL 자체가 권한이다.
#
# 설치 전에 손으로 만들어야 한다. 없으면 파드가 마운트에 실패해 뜨지 않는다.
#   kubectl -n monitoring create secret generic alertmanager-discord \
#     --from-literal=url='<Discord webhook URL>'
#
# Alertmanager v0.34.1 기준. discord_configs 는 v0.25+, webhook_url_file 은 v0.26+ 이다.
alertmanager:
  alertmanagerSpec:
    # 위 Secret 을 /etc/alertmanager/secrets/alertmanager-discord/ 로 마운트한다.
    secrets:
      - alertmanager-discord

    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: discord
      group_by: [alertname, namespace]
      # 몰린 알림을 묶어서 한 번에 보낸다.
      group_wait: 30s
      group_interval: 5m
      # 해소되지 않은 알림을 다시 알리는 주기.
      repeat_interval: 4h
      routes:
        # Watchdog 은 "알림 체계가 살아있다" 를 알리려고 항상 발화한다.
        # 버리지 않으면 몇 분마다 울려서 진짜 알림이 묻힌다.
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"

    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/url
            send_resolved: true
            # message 는 |- 를 쓴다. >- 는 줄바꿈을 공백으로 접어 한 줄로 뭉친다.
            # 노드 라벨 이름은 차트 relabeling 에 따라 달라서 3단 폴백을 둔다.
            # instance 는 node-exporter 지표에 항상 붙으므로 최소한 IP 는 나온다.
            title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
            message: |-
              {{ if .CommonLabels.severity }}**{{ .CommonLabels.severity | toUpper }}**{{ end }}{{ if .CommonLabels.namespace }} · `{{ .CommonLabels.namespace }}`{{ end }}
              {{ if .CommonAnnotations.summary }}{{ .CommonAnnotations.summary }}{{ end }}
              {{ range .Alerts.Firing }}
              🔴 {{ if .Labels.kubernetes_node }}`{{ .Labels.kubernetes_node }}`{{ else if .Labels.node }}`{{ .Labels.node }}`{{ else if .Labels.instance }}`{{ .Labels.instance }}`{{ end }}{{ if .Labels.pod }} / `{{ .Labels.pod }}`{{ end }}
              {{ .Annotations.description }}
              {{- if .Annotations.runbook_url }}
              → {{ .Annotations.runbook_url }}
              {{- end }}
              {{- end }}
              {{ range .Alerts.Resolved }}
              🟢 {{ if .Labels.kubernetes_node }}`{{ .Labels.kubernetes_node }}`{{ else if .Labels.node }}`{{ .Labels.node }}`{{ else if .Labels.instance }}`{{ .Labels.instance }}`{{ end }} 해소
              {{- end }}
