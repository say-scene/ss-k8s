# grafana/alloy 차트용. 검증 버전 1.14.3; Argo CD에서도 고정한다.
# Argo CD 설정: helm.releaseName=alloy-otlp, destination.namespace=monitoring.
# 배포 네임스페이스는 values가 아닌 Argo CD Application의 destination에서 지정한다.
# resources.requests는 적용 보류. 차트 기본 요청량을 배포 전 렌더링으로 확인한다.
# 1번 담당자의 Grafana·Prometheus와 monitoring 네임스페이스를 공유한다.
# Alloy 자체 메트릭 수집 여부와 ServiceMonitor 선택 조건은 1번 담당자와 확인한다.
# 아래 Tempo Service 주소는 배포 시 실제 release 이름·네임스페이스에 맞춰 변경한다.
# BE(sayscene)가 사용할 주소: http://alloy-otlp.monitoring.svc.cluster.local:4318.
# 실제 Service 이름을 배포 후 확인해 BE Deployment에 반영한다.
alloy:
  extraPorts:
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  configMap:
    content: |
      otelcol.receiver.otlp "be" {
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.monitoring.svc.cluster.local:4317"
          tls {
            insecure = true
          }
        }
      }

controller:
  type: deployment
  replicas: 1
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
