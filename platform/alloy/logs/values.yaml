# grafana/alloy 차트용. Helm 검증 버전: 1.14.3. Argo CD에서도 같은 버전으로 고정한다.
# Argo CD 설정: helm.releaseName=alloy-logs, 임시 destination.namespace=observability.
# 네임스페이스는 1번 담당자와 추후 조율한다.
# resources.requests는 적용 보류. 차트 기본 요청량을 배포 전 렌더링으로 확인한다.
# Loki를 같은 네임스페이스에 release 이름 loki로 설치해 gateway Service를 만든다는 전제다.
# 1번 담당자와 확인: 관측 네임스페이스와 Grafana Loki 데이터소스 주소
# (gateway Service 기준 http://loki-gateway.<관측-네임스페이스>.svc.cluster.local:80).
# 아래 Loki Service 주소는 배포 시 실제 release 이름·네임스페이스에 맞춰 변경한다.
# Alloy 자체 메트릭 수집 여부 및 수집 시 Prometheus의 ServiceMonitor 라벨·네임스페이스 선택 조건도 맞춘다.
alloy:
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.cluster.receiver]
      }

      loki.write "cluster" {
        endpoint {
          url = "http://loki-gateway:80/loki/api/v1/push"
        }
      }

controller:
  type: daemonset
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
