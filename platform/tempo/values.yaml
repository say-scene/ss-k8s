# grafana-community/tempo 차트용. 검증 버전 2.4.0 (Tempo 2.10.8); Argo CD에서도 고정한다.
# Argo CD 설정: helm.releaseName=tempo, destination.namespace=monitoring.
# 배포 네임스페이스는 values가 아닌 Argo CD Application의 destination에서 지정한다.
# 1번 담당자의 Grafana 데이터소스 주소: http://tempo.monitoring.svc.cluster.local:3200.
# trace 블록은 S3에 저장한다. EC2 역할 sayscenecontrolplanerole의 ss-tempo-s3-access 사용.
# Pod의 IMDS·S3 접근은 배포 후 검증한다. 액세스 키를 이 파일에 넣지 않는다.
# WAL·작업 파일은 로컬 임시 저장이므로 Pod 재생성 시 미전송 데이터는 유실될 수 있다.
# Grafana 데이터소스 Service 주소와 Alloy가 쓰는 Tempo 수신 주소는 배포 후 확인해 변경한다.
# resources.requests는 적용 보류. 차트 기본 요청량을 배포 전 렌더링으로 확인한다.
# Tempo 자체 메트릭을 수집한다면 Prometheus의 ServiceMonitor 라벨·네임스페이스 선택 조건도 맞춘다.
tempo:
  # TraceQL의 rate·평균·분위수 그래프 집계를 활성화한다.
  metricsGenerator:
    enabled: true
    processor:
      local_blocks:
        filter_server_spans: false
        # 집계용 블록도 기존 S3에 기록하여 과거 구간을 조회한다.
        flush_to_storage: true
    storage:
      path: /var/tempo/generator/wal
    traces_storage:
      path: /var/tempo/generator/traces
  overrides:
    defaults:
      metrics_generator:
        processors:
          - local-blocks
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
  storage:
    trace:
      backend: s3
      local: null
      s3:
        bucket: ss-tempo-traces-944296702922-ap-northeast-2-an
        endpoint: s3.ap-northeast-2.amazonaws.com
        region: ap-northeast-2
        insecure: false
      wal:
        path: /var/tempo/wal

persistence:
  enabled: false

nodeSelector:
  node-role.kubernetes.io/control-plane: ""
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
