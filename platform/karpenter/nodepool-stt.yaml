apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: stt
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # ss-triton(CPU Whisper STT) 전용. STT가 물리 코어를 꽉 써서 다른 파드와 섞으면 양쪽 다 느려진다.
  template:
    metadata:
      labels:
        sayscene.io/workload: stt
    spec:
      # general과 같은 AMI·서브넷을 쓴다.
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: general
      # toleration이 있는 ss-triton만 허용한다.
      taints:
        - key: sayscene.io/workload
          value: stt
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: node.kubernetes.io/instance-type
          operator: In
          # c7i.large는 general AMI에서 Pod DNS가 실패해 보류했다(NIC 이름 문제로 추정, 미확인).
          values: ["t3.large"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
  # 노드 최대 2대 = ScaledObject maxReplicaCount 2(t3.large 1대당 cpu 2, 8Gi). KEDA 테스트용 상한이다.
  limits:
    cpu: "4"
    memory: 16Gi
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m
