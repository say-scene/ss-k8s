# Git source: path=platform/loki, directory.include=datasource.yaml, ref=values.
# Helm values는 $values/platform/loki/values.yaml로 별도 전달한다.
# Argo CD destination.namespace=monitoring, Loki helm.releaseName=loki를 전제로 한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-loki
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local:80
        isDefault: false
